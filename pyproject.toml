[project]
name = "llm-finetune-eval"
version = "0.0.1"
description = "End-to-end LLM fine-tuning, evaluation, serving, and retraining loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "<NAMA KAMU>", email = "<EMAIL>" }]
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]
data = [
    "pandas>=2.2",
    "pandera[pandas]>=0.20",
    "datasketch>=1.6",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "dvc[gdrive]>=3.50",
]
train = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.12",
    "bitsandbytes>=0.43",
    "datasets>=2.20",
    "accelerate>=0.33",
    "trl>=0.10",
    "hydra-core>=1.3",
    "wandb>=0.17",
    "mlflow>=2.15",
]
eval = [
    "lm-eval>=0.4",
    "deepeval>=1.0",
    "ragas>=0.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "openai>=1.40",
]
serve = [
    "vllm>=0.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "slowapi>=0.1",
    "httpx>=0.27",
]
observability = [
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "langfuse>=2.50",
    "evidently>=0.4",
]
loadtest = ["locust>=2.30"]
cloud = ["boto3>=1.35"]
integration = [
    "testcontainers[postgres]>=4.8",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]


[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]  # assert ok di tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"notebooks/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["notebooks/", "experiments/"]

[tool.pytest.ini_options]
markers = [
    "unit: fast tests, no external deps",
    "integration: requires Docker/DB",
    "slow: long-running, nightly only",
]
addopts = "-m 'not integration and not slow' --strict-markers"
testpaths = ["tests"]
