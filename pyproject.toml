[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-finetune-eval"
version = "0.0.1"
description = "End-to-end LLM fine-tuning, evaluation, serving, and retraining loop — built to production standards."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "WoodinGlass" }]
keywords = ["llm", "qlora", "fine-tuning", "evaluation", "vllm", "mlops", "llmops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Base install is intentionally empty — everything lives in extras.
dependencies = []

[project.optional-dependencies]

# ── developer tooling (default for `make setup`) ────────────────
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "detect-secrets==1.5.0",   # same pin as .pre-commit-config rev
    "pyyaml>=6.0",
    "types-requests",
    "types-PyYAML",
]

# ── data pipeline (M1) ─────────────────────────────────────────
data = [
    "pandas>=2.2",
    "polars>=1.12",
    "pyarrow>=18.0",
    "pandera>=0.20",
    "datasketch>=1.6",
    "presidio-anonymizer>=2.2",
    "presidio-analyzer>=2.2",
    "tiktoken>=0.8",
    "dvc>=3.55",
    "dvc-s3>=3.2",
    "huggingface-hub>=0.26",
    "datasets>=3.0",
]

# ── QLoRA training (M2) ────────────────────────────────────────
train = [
    "torch>=2.4",
    "transformers>=4.46",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "accelerate>=1.0",
    "datasets>=3.0",
    "trl>=0.12",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "einops>=0.8",
    "wandb>=0.18",
    "mlflow>=2.17",
    "huggingface-hub>=0.26",
]

# ── eval harness (M3) ──────────────────────────────────────────
eval = [
    "lm-eval>=0.4.5",
    "deepeval>=1.4",
    "ragas>=0.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "openai>=1.54",
    "anthropic>=0.39",
    "pandas>=2.2",
    "tiktoken>=0.8",
]

# ── serving & guardrails (M5) ──────────────────────────────────
serve = [
    "vllm>=0.6.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "slowapi>=0.1.9",
    "tiktoken>=0.8",
    "httpx>=0.27",
]

# ── observability (M8) ─────────────────────────────────────────
obs = [
    "prometheus-client>=0.21",
    "langfuse>=2.53",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "evidently>=0.4.33",
]

# ── deploy (M7) ────────────────────────────────────────────────
deploy = [
    "boto3>=1.35",
    "python-dotenv>=1.0",
]

# ── convenience: everything (heavy!) ───────────────────────────
all = [
    "llm-finetune-eval[dev,data,train,eval,serve,obs,deploy]",
]

# ═══════════════════════════════════════════════════════════════
# Hatch build
# ═══════════════════════════════════════════════════════════════
[tool.hatch.build.targets.wheel]
packages = ["src/llm_ft"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

# ═══════════════════════════════════════════════════════════════
# Ruff
# ═══════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RET", "PTH"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**"      = ["ARG", "S101", "PLR2004"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["llm_ft"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ═══════════════════════════════════════════════════════════════
# mypy
# ═══════════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
# Platform-specific modules without stubs (google.colab, kaggle_secrets);
# typing is done via try/except + explicit signatures.
exclude = ["build/", "dist/", "notebooks/", "src/llm_ft/secrets\\.py"]

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandera",
    "pandera.pandas",
    "pandera.typing",
    "bitsandbytes.*",
    "peft.*",
    "trl.*",
    "vllm.*",
    "presidio_analyzer.*",
    "presidio_anonymizer.*",
    "datasketch.*",
    "lm_eval.*",
    "ragas.*",
    "deepeval.*",
    "langfuse.*",
    "evidently.*",
]
ignore_missing_imports = true

# ═══════════════════════════════════════════════════════════════
# pytest
# ═══════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast tests without external dependencies (default)",
    "integration: tests that need Docker/DB/services",
    "slow: long-running tests, nightly only",
    "data: data validation and schema tests",
    "smoke: small end-to-end checks",
    "load: load and performance tests",
]

# ═══════════════════════════════════════════════════════════════
# coverage
# ═══════════════════════════════════════════════════════════════
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
