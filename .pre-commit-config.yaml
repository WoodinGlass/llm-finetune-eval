# ─────────────────────────────────────────────────────────────
# Pre-commit hooks — enforced on every commit and in CI (M6).
# Install locally:  pre-commit install
# Run on all files: pre-commit run --all-files
# ─────────────────────────────────────────────────────────────
default_language_version:
  python: python3.11

default_stages: [pre-commit]

repos:
  # ── generic hygiene ─────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: check-yaml
        args: ["--allow-multiple-documents", "--unsafe"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key
      - id: forbid-submodules

  # ── ruff: lint + format (replaces flake8/isort/black) ───────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # ── mypy: static typing on src/ only ────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^src/
        exclude: ^src/llm_ft/secrets\.py$
        args: ["--config-file=pyproject.toml"]
        additional_dependencies:
          - types-requests
          - types-PyYAML

  # ── detect-secrets: block accidental leaks ──────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            \.secrets\.baseline$|
            \.env\.example$|
            uv\.lock$|
            experiments/baseline/.*\.json$|
            .*/\.gitkeep$
          )$
