# @package data
seed: 42

sources:
  - name: gsm8k_en
    hf_path: openai/gsm8k
    hf_config: main
    split_train: train
    split_test: test
    lang: en
    task: math

  - name: gsm8k_id
    hf_path: local://data/processed/gsm8k_id
    split_train: train
    split_test: test
    lang: id
    task: math

  - name: math_en
    hf_path: hendrycks/competition_math
    split_train: train
    split_test: test
    lang: en
    task: math
    max_train: 7500

  - name: physics_en
    hf_path: desimfj/PHYSICS
    split_train: train
    split_test: test
    lang: en
    task: physics

  - name: physics_id
    hf_path: local://data/processed/physics_id
    split_train: train
    split_test: test
    lang: id
    task: physics

  - name: arxiv_physics_en
    hf_path: ArtifactAI/arxiv-physics-instruct-tune-30k
    split_train: train
    lang: en
    task: physics
    max_train: 5000

  - name: pengetahuan_umum_id
    hf_path: seniya/pengetahuan_umum_chatml
    split_train: train
    lang: id
    task: mixed
    filter_topics: [Fisika, Matematika]

output_format: |
  <reasoning>
  {reasoning}
  </reasoning>
  \boxed{{{answer}}}

frozen_test_set: data/processed/test.lock
