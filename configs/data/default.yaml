# @package data

train_dir: "data/processed/train"
test_dir:  "data/processed/test"

train_files:
  math: "data/processed/train/math_train.jsonl"
  physics: "data/processed/train/physics_train.jsonl"
  ood: "data/processed/train/ood_train.jsonl"
  adversarial_ood: "data/processed/train/adversarial_ood_train.jsonl"

# sampling
max_samples: null          # null = use everything
require_all_domains: false # if true, sample evenly across domains (smoke test)
shuffle_seed: 42

# record fields (must match src/llm_ft/schema.py)
field_id: "id"
field_domain: "domain"
field_prompt: "prompt"
field_answer: "answer"
field_reasoning: "reasoning"

# system prompt per domain (kept identical to eval/baseline.py for parity)
system_prompts:
  math: "Please reason step by step, and put your final answer within \\boxed{}."
  physics: "You are a physics expert. Read the multiple-choice question carefully. Reason step by step if needed, then output your final answer as a single capital letter (A, B, C, or D) inside \\boxed{}, e.g. \\boxed{A}. Do not include any other text after the boxed answer."
  ood: null                # refusal behavior learned from target, not prompt
  adversarial_ood: null
