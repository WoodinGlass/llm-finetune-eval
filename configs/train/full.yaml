# @package _global_

defaults:
  - qlora_base
  - _self_

run:
  name: "m2-full"
  output_dir: "${oc.env:LLM_FT_CHECKPOINT_DIR,/content/drive/MyDrive/llm-ft/checkpoints}/m2-full"
  mlflow_dir: "${oc.env:LLM_FT_MLFLOW_DIR,/content/drive/MyDrive/llm-ft/mlruns}"
  tags: ["m2", "qlora", "full"]
  notes: "full QLoRA 7B on math+physics 4k, 3 epochs"

model:
  max_seq_length: 2048
  lora:
    r: 16
    lora_alpha: 32

data:
  max_samples: null
  require_all_domains: false

training:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  save_steps: 200
  save_total_limit: 8
  logging_steps: 10
  report_to: []
  fp16: false
  bf16: false
  optim: "paged_adamw_32bit"
