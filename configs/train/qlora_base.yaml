# @package _global_

run:
  name: "m2-qlora-base"
  project: "llm-finetune-eval"
  seed: 42
  output_dir: "${oc.env:LLM_FT_CHECKPOINT_DIR,/content/drive/MyDrive/llm-ft/checkpoints}/m2"
  mlflow_dir: "${oc.env:LLM_FT_MLFLOW_DIR,/content/drive/MyDrive/llm-ft/mlruns}"
  tags: ["m2", "qlora", "base"]
  notes: "baseline config for QLoRA 7B on math+physics 4k"

training:
  # optimization
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  optim: "paged_adamw_32bit"

  # precision
  fp16: false
  bf16: false

  # memory
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false

  # logging / saving
  logging_steps: 10
  save_steps: 200
  save_total_limit: 5
  eval_strategy: "no"           # no separate eval set; full eval is M3
  report_to: []

  # dataloader
  dataloader_num_workers: 2
  remove_unused_columns: false
  group_by_length: true
  ddp_find_unused_parameters: false

  # misc
  seed: 42
  data_seed: 42
  save_safetensors: true
  neftune_noise_alpha: null    # opt-in later
